name: CI/CD - Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to Droplet
        env:
          DO_IP: ${{ secrets.DROPLET_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no root@${DO_IP} << 'EOF'
          cd /var/www/phoenix
          git pull origin main
          composer install --no-dev -o || true
          php artisan migrate --force || true
          php artisan db:seed --class=AdminUserSeeder || true
          npm install || true
          npm run build || true
          systemctl restart php8.2-fpm || true
          nginx -t && systemctl reload nginx || true
          EOF
