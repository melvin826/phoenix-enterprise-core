version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoenix_app
    container_name: phoenix_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - phoenix_net
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:stable
    container_name: phoenix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./deploy/nginx_phoenix.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - phoenix_net
    depends_on:
      - app

  mysql:
    image: mariadb:10.6
    container_name: phoenix_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: phoenix
      MYSQL_USER: phoenix
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - phoenix_net

  redis:
    image: redis:7
    container_name: phoenix_redis
    restart: unless-stopped
    networks:
      - phoenix_net

  workspace:
    image: php:8.2-cli
    container_name: phoenix_workspace
    volumes:
      - ./:/var/www
    working_dir: /var/www
    networks:
      - phoenix_net
    tty: true

volumes:
  mysql_data:

networks:
  phoenix_net:
    driver: bridge
